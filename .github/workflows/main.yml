name: Mirror to GitLab

on:
  push:
    branches:
      - "**"
    tags:
      - "**"

  workflow_dispatch:

  schedule:
    # Reconcile the mirror every hour.
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: gitlab-mirror
  cancel-in-progress: false

jobs:
  mirror:
    name: Mirror repository
    runs-on: ubuntu-latest

    steps:
      - name: Mirror branches and tags to GitLab
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}

          # Change this to your GitLab repository URL.
          GITLAB_URL: https://gitlab.com/neorick/sandbox/apps/research/omnigent.git

        run: |
          set -euo pipefail

          mkdir mirror.git
          cd mirror.git

          git init --bare --initial-branch=main

          GH_AUTH="$(
            printf 'x-access-token:%s' "$GH_TOKEN" |
            base64 -w0
          )"

          GL_AUTH="$(
            printf 'oauth2:%s' "$GITLAB_TOKEN" |
            base64 -w0
          )"

          echo "Fetching branches and tags from GitHub..."

          git \
            -c "http.extraheader=AUTHORIZATION: basic $GH_AUTH" \
            fetch \
            --prune \
            --tags \
            "https://github.com/${GITHUB_REPOSITORY}.git" \
            '+refs/heads/*:refs/heads/*'

          echo "Pushing branches and tags to GitLab..."

          git \
            -c "http.extraheader=AUTHORIZATION: basic $GL_AUTH" \
            push \
            --force \
            "$GITLAB_URL" \
            '+refs/heads/*:refs/heads/*' \
            '+refs/tags/*:refs/tags/*'

          echo "GitLab mirror completed successfully."
